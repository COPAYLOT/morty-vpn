name: build
permissions:
  contents: read

on:
  push:
    branches:
      - morty-vpn
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        description: "Build type"
        required: true
        default: debug
        options:
          - debug
          - nightly
          - release
      flavor:
        type: choice
        description: "Product flavor"
        required: true
        default: fdroid
        options:
          - fdroid
          - standalone
    secrets:
      SIGNING_KEY_ALIAS:
        required: false
      SIGNING_KEY_PASSWORD:
        required: false
      SIGNING_STORE_PASSWORD:
        required: false
      SERVICE_ACCOUNT_JSON:
        required: false
      KEYSTORE:
        required: false
  workflow_call:
    inputs:
      build_type:
        type: string
        description: "Build type"
        required: true
        default: debug
      flavor:
        type: string
        description: "Product flavor"
        required: false
        default: fdroid
    secrets:
      SIGNING_KEY_ALIAS:
        required: false
      SIGNING_KEY_PASSWORD:
        required: false
      SIGNING_STORE_PASSWORD:
        required: false
      SERVICE_ACCOUNT_JSON:
        required: false
      KEYSTORE:
        required: false

env:
  UPLOAD_DIR_ANDROID: android_artifacts

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      KEY_STORE_FILE: 'android_keystore.jks'
      KEY_STORE_LOCATION: ${{ github.workspace }}/app/keystore/
      # Skip keystore decode for debug builds or when KEYSTORE secret is unset
      KEYSTORE_SET: ${{ secrets.KEYSTORE != '' }}
    outputs:
      UPLOAD_DIR_ANDROID: ${{ env.UPLOAD_DIR_ANDROID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Decode Keystore
        id: decode_keystore
        if: ${{ env.KEYSTORE_SET == 'true' }}
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: ${{ env.KEY_STORE_FILE }}
          fileDir: ${{ env.KEY_STORE_LOCATION }}
          encodedString: ${{ secrets.KEYSTORE }}
      - name: Create keystore path env var
        if: ${{ inputs.build_type != 'debug' }}
        run: |
          store_path=${{ env.KEY_STORE_LOCATION }}${{ env.KEY_STORE_FILE }}
          echo "KEY_STORE_PATH=$store_path" >> $GITHUB_ENV

      - name: Build APK
        run: |
          # Push trigger: hardcode standalone+debug. workflow_dispatch: use inputs (with defaults).
          if [ "${{ github.event_name }}" = "push" ]; then
            flavor="standalone"
            build_type="debug"
          else
            flavor="${{ inputs.flavor }}"
            build_type="${{ inputs.build_type }}"
          fi
          echo "Building flavor=$flavor build_type=$build_type"
          case $build_type in
            "release")
              ./gradlew :app:assemble${flavor^}Release --info
              ;;
            "nightly")
              ./gradlew :app:assemble${flavor^}Nightly --info
              ;;
            "debug")
              ./gradlew :app:assemble${flavor^}Debug --stacktrace
              ;;
          esac
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - name: Get release apk path
        id: apk-path
        run: |
          # For push trigger, hardcode path. For workflow_dispatch, use inputs.
          if [ "${{ github.event_name }}" = "push" ]; then
            flavor="standalone"
            build_type="debug"
          else
            flavor="${{ inputs.flavor }}"
            build_type="${{ inputs.build_type }}"
          fi
          path=$(find . -regex "^.*/build/outputs/apk/${flavor}/${build_type}/.*\.apk$" -type f | head -1 | tail -c+2)
          echo "path=$path" >> $GITHUB_OUTPUT
      - name: Upload All APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          # For push, hardcode name. For workflow_dispatch, use flavor name.
          name: ${{ github.event_name == 'push' && 'morty-vpn-standalone-debug' || format('android_artifacts_{0}', inputs.flavor) }}
          path: ${{ github.event_name == 'push' && 'app/build/outputs/apk/standalone/debug/*.apk' || format('app/build/outputs/apk/{0}/{1}/*.apk', inputs.flavor, inputs.build_type) }}
          retention-days: 7
          if-no-files-found: error